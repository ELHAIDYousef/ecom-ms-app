spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:h2:mem:customer-db
  h2:
    console:
      enabled: true
  cloud:
    discovery:
      enabled: true
    config:
      enabled: false

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka